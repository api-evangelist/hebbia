apis:
- aid: hebbia:hebbia-matrix
  name: Hebbia Matrix
  description: Matrix is Hebbia's flagship AI workspace for reasoning across unstructured enterprise documents at scale. It
    runs spreadsheet-style queries (rows and columns) over very large document sets to extract structured answers with citations
    from filings, transcripts, decks, expert calls, and proprietary research. Matrix is delivered as a hosted enterprise application
    with customer-managed connectors; programmatic access is provided to customers via their Hebbia engagement.
  humanURL: https://www.hebbia.com/
  tags:
  - AI
  - Document Analysis
  - Matrix
  - Research
  - Workflows
  properties:
  - type: Documentation
    url: https://www.hebbia.com/
- aid: hebbia:hebbia-connectors
  name: Hebbia Connectors
  description: Hebbia connects to enterprise content stores and financial data providers to make their contents searchable
    and reasoning-ready inside Matrix. Connectors include enterprise data systems (Snowflake, AWS S3, SharePoint, Box, Dropbox,
    Egnyte) and financial data providers (FactSet, S&P Capital IQ, PitchBook, Guidepoint, Thirdbridge), as well as public
    sources such as earnings calls and SEC filings.
  humanURL: https://www.hebbia.com/
