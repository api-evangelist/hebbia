aid: hebbia
name: Hebbia
description: Hebbia provides institutional-grade AI for finance and high-stakes enterprise work, centered on its Matrix product
  that reasons across massive volumes of unstructured documents. The platform connects to enterprise data sources such as
  Snowflake, AWS S3, SharePoint, Box, Dropbox, and Egnyte, and financial data providers including FactSet, S&P Capital IQ,
  PitchBook, Guidepoint, and Thirdbridge. Hebbia is a sales-led enterprise product without a fully public developer portal;
  API and integration access is granted to customers through their account team.
